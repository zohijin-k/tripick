services:
  - type: web
    name: tripick-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run deploy:start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tripick-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TOUR_API_KEY
        sync: false
      - key: TOUR_API_BASE_URL
        value: https://apis.data.go.kr/B551011/KorService1
      - key: CORS_ORIGINS
        value: ''

databases:
  - name: tripick-postgres
    plan: free
    region: singapore
    databaseName: tripick
    user: tripick
    postgresMajorVersion: '16'
    ipAllowList: []
